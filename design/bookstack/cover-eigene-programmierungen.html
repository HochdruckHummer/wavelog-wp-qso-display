<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden;background:#1b2a4a}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500"
     font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3f6b"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-width="1" opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="880" height="500" fill="url(#bg)"/>
  <rect width="880" height="500" fill="url(#grid)"/>

  <!-- editor window -->
  <g filter="url(#shadow)" transform="translate(470 70)">
    <rect width="340" height="230" rx="16" fill="#0e1628"/>
    <rect width="340" height="38" rx="16" fill="#1d2a47"/>
    <rect y="22" width="340" height="16" fill="#1d2a47"/>
    <circle cx="24" cy="19" r="6" fill="#ef6b5e"/>
    <circle cx="44" cy="19" r="6" fill="#f2c84b"/>
    <circle cx="64" cy="19" r="6" fill="#5cc78a"/>
    <g font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="17">
      <text x="24" y="76"><tspan fill="#7aa2f7">function</tspan><tspan fill="#e0e6f5"> build() {</tspan></text>
      <text x="48" y="106"><tspan fill="#bb9af7">const</tspan><tspan fill="#e0e6f5"> idea = </tspan><tspan fill="#9ece6a">"…"</tspan><tspan fill="#e0e6f5">;</tspan></text>
      <text x="48" y="136"><tspan fill="#7aa2f7">return</tspan><tspan fill="#e0e6f5"> code(idea);</tspan></text>
      <text x="24" y="166" fill="#e0e6f5">}</text>
      <rect x="24" y="186" width="10" height="20" fill="#5cc78a" opacity=".9"/>
    </g>
  </g>

  <!-- big brackets symbol -->
  <g transform="translate(70 92)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 6 L6 42 L38 78" stroke="#5cc78a" stroke-width="12"/>
    <path d="M102 6 L134 42 L102 78" stroke="#ef6b5e" stroke-width="12"/>
    <path d="M82 0 L58 84" stroke="#f2c84b" stroke-width="12"/>
  </g>

  <text x="70" y="290" fill="#fff" font-size="54" font-weight="700">Eigene</text>
  <text x="70" y="350" fill="#fff" font-size="54" font-weight="700">Programmierungen</text>
  <text x="72" y="400" fill="#c9d6f2" font-size="24">Plugins, Tools und Programme</text>
  <text x="72" y="440" fill="#8fa3cc" font-size="20" letter-spacing="2">DL8YDP</text>
</svg>
</body></html>
