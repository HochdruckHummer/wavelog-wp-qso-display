name: Release

# Creates a GitHub release with an installable plugin ZIP whenever main
# contains a plugin version that has no release yet. If the secrets
# SVN_USERNAME and SVN_PASSWORD are set and the version is not yet in the
# WordPress.org plugin directory, it is deployed there as well. Both checks
# are independent, so a missing deployment can be caught up by re-running
# this workflow manually (Actions → Release → Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_SLUG: qso-statistics-for-wavelog
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          version=$(grep -m1 -E '^Version:' wavelog-data-display.php | sed -E 's/^Version:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "No Version found in plugin header" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decide what to do
        id: todo
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "GitHub release ${{ steps.version.outputs.tag }} already exists."
            release=false
          else
            release=true
          fi

          deploy=false
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "SVN secrets not set, skipping WordPress.org deployment."
          else
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://plugins.svn.wordpress.org/$PLUGIN_SLUG/tags/${{ steps.version.outputs.version }}/")
            case "$status" in
              200) echo "Version ${{ steps.version.outputs.version }} is already on WordPress.org." ;;
              404) deploy=true ;;
              *)   echo "Unexpected HTTP status $status from WordPress.org SVN" >&2; exit 1 ;;
            esac
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ] || [ "$deploy" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.todo.outputs.build == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Check PHP syntax
        if: steps.todo.outputs.build == 'true'
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Check readme.txt stable tag
        if: steps.todo.outputs.build == 'true'
        run: |
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/^Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          if [ "$stable" != "${{ steps.version.outputs.version }}" ]; then
            echo "Stable tag in readme.txt ($stable) does not match plugin version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Extract changelog
        if: steps.todo.outputs.release == 'true'
        run: |
          # Section "### <version>" in README.md up to the next heading
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "### " v { found = 1; next }
            found && /^##/ { exit }
            found { print }
          ' README.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for ${{ steps.version.outputs.version }} in README.md" >&2
            exit 1
          fi

      - name: Build plugin ZIP
        if: steps.todo.outputs.build == 'true'
        run: |
          mkdir -p "build/$PLUGIN_SLUG"
          cp -R wavelog-data-display.php uninstall.php readme.txt README.md LICENSE assets "build/$PLUGIN_SLUG/"
          (cd build && zip -r "../$PLUGIN_SLUG-${{ steps.version.outputs.version }}.zip" "$PLUGIN_SLUG")

      - name: Create release
        if: steps.todo.outputs.release == 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$PLUGIN_SLUG-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md

      - name: Deploy to WordPress.org
        if: steps.todo.outputs.deploy == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: ${{ env.PLUGIN_SLUG }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/${{ env.PLUGIN_SLUG }}
